<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon Técnico Automotivo Embutido -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'%3E%3Ccircle cx='12' cy='12' r='3' fill='white'/%3E%3Cpath d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desenhos Técnicos de Peças em Marca d'Água Suave no Fundo -->
  <!-- Peça 1: Disco de Freio Ventilado com Pinça -->
  <svg class="bg-piece piece-rotor" viewBox="0 0 200 200" fill="none" stroke="currentColor">
    <circle cx="100" cy="100" r="90" stroke-dasharray="6 3"/>
    <circle cx="100" cy="100" r="82"/>
    <circle cx="100" cy="100" r="54"/>
    <circle cx="100" cy="100" r="30"/>
    <circle cx="100" cy="30" r="2.5" fill="currentColor"/>
    <circle cx="100" cy="40" r="2.5" fill="currentColor"/>
    <circle cx="100" cy="160" r="2.5" fill="currentColor"/>
    <circle cx="100" cy="170" r="2.5" fill="currentColor"/>
    <circle cx="30" cy="100" r="2.5" fill="currentColor"/>
    <circle cx="40" cy="100" r="2.5" fill="currentColor"/>
    <circle cx="160" cy="100" r="2.5" fill="currentColor"/>
    <circle cx="170" cy="100" r="2.5" fill="currentColor"/>
    <circle cx="100" cy="78" r="5"/>
    <circle cx="121" cy="93" r="5"/>
    <circle cx="113" cy="118" r="5"/>
    <circle cx="87" cy="118" r="5"/>
    <circle cx="79" cy="93" r="5"/>
    <path d="M140 30 C180 50, 195 90, 185 130 L160 120 C168 95, 158 65, 130 50 Z" stroke-width="2"/>
  </svg>

  <!-- Peça 2: Amortecedor com Mola Helicoidal -->
  <svg class="bg-piece piece-coilover" viewBox="0 0 100 220" fill="none" stroke="currentColor">
    <circle cx="50" cy="20" r="14"/>
    <circle cx="50" cy="20" r="6"/>
    <rect x="44" y="34" width="12" height="30" rx="2"/>
    <path d="M25 64 Q75 74 25 84 Q75 94 25 104 Q75 114 25 124 Q75 134 25 144 Q75 154 25 164" stroke-width="3.5"/>
    <rect x="38" y="164" width="24" height="30" rx="4"/>
    <circle cx="50" cy="202" r="12"/>
    <circle cx="50" cy="202" r="5"/>
  </svg>

  <main class="container">
    
    <!-- Cabeçalho Limpo, Moderno e Direto -->
    <header class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <h1>Central de Peças</h1>
    </header>

    <!-- Campo de Localizar Rápido -->
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Localizar botão... (ex: estoque, vendas, compra, csps)" autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn" title="Limpar busca" aria-label="Limpar busca">&times;</button>
      </div>
    </div>

    <!-- Grade de Botões (Apenas Nome + Seta, sem ícones) -->
    <section class="buttons-grid" id="buttonsGrid">
      <!-- Inserido dinamicamente pelo app.js -->
    </section>

    <!-- Mensagem quando não encontrar nenhum botão -->
    <div id="noResults" class="no-results" style="display: none;">
      Nenhum botão encontrado.
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
